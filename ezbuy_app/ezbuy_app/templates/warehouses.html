{% extends "base.html" %}
{% block title %}Warehouses{% endblock %}
{% block content %}
<h1>Warehouses</h1>
<div class="panel">
  <h2>Add Warehouse</h2>
  <form method="post" class="form-grid">
    <div><label>Name</label><input type="text" name="name" required></div>
    <div><label>Location</label><input type="text" name="location"></div>
    <div><label>Manager</label><input type="text" name="manager"></div>
    <div><button type="submit">Add Warehouse</button></div>
  </form>
</div>
<div class="panel">
  <h2>All Warehouses</h2>
  <table>
    <thead><tr><th>Name</th><th>Location</th><th>Manager</th><th></th></tr></thead>
    <tbody>
      {% for w in warehouses %}
      <tr>
        <td>{{ w.name }}</td>
        <td>{{ w.location or '—' }}</td>
        <td>{{ w.manager or '—' }}</td>
        <td>
          <form method="post" action="{{ url_for('delete_warehouse', wid=w.id) }}" onsubmit="return confirm('Delete this warehouse?');">
            <button type="submit" class="btn-sm danger">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="muted">No warehouses yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
