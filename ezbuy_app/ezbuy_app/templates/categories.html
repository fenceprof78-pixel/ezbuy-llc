{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1>Categories</h1>
<div class="panel">
  <h2>Add Category</h2>
  <form method="post" class="form-grid">
    <div><label>Name</label><input type="text" name="name" required></div>
    <div class="full"><label>Description</label><input type="text" name="description"></div>
    <div><button type="submit">Add Category</button></div>
  </form>
</div>
<div class="panel">
  <h2>All Categories</h2>
  <table>
    <thead><tr><th>Name</th><th>Description</th><th></th></tr></thead>
    <tbody>
      {% for c in categories %}
      <tr>
        <td>{{ c.name }}</td>
        <td>{{ c.description or '—' }}</td>
        <td>
          <form method="post" action="{{ url_for('delete_category', cid=c.id) }}" onsubmit="return confirm('Delete this category?');">
            <button type="submit" class="btn-sm danger">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="muted">No categories yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
