{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h1>Users</h1>

<div class="panel">
  <h2>Add User</h2>
  <form method="post" class="form-grid">
    <div><label>Username</label><input type="text" name="username" required></div>
    <div><label>Full Name</label><input type="text" name="full_name"></div>
    <div><label>Password</label><input type="password" name="password" required></div>
    <div><label>Role</label>
      <select name="role">
        {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
      </select>
    </div>
    <div><button type="submit">Add User</button></div>
  </form>
</div>

<div class="panel">
  <h2>All Users</h2>
  <table>
    <thead><tr><th>Username</th><th>Full Name</th><th>Role</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr><td>{{ u.username }}</td><td>{{ u.full_name or '—' }}</td><td>{{ u.role }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
